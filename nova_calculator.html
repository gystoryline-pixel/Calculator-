<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d16"><title>Nova Calculator</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,#1a2842,#090d16 60%);color:#f4f7ff;font-family:system-ui,Arial}.app{width:100%;max-width:430px}.head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 16px;font-weight:900;letter-spacing:1px}.head b{color:#67e8f9}.pill{font-size:12px;color:#9aa9c2;border:1px solid #29364c;padding:7px 10px;border-radius:20px}.calc{background:linear-gradient(145deg,#121b2b,#0e1420);border:1px solid #26344a;border-radius:27px;padding:17px;box-shadow:0 25px 70px #0006}.display{height:165px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden;padding:12px 5px 18px}.prev{min-height:26px;color:#8e9db5;font-size:1rem}.now{font-size:clamp(2.5rem,12vw,4rem);font-weight:750;line-height:1.15;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:65px;border:1px solid #28364b;border-radius:18px;background:#1a2435;color:#f4f7ff;font:600 1.25rem system-ui;cursor:pointer}.key:active{transform:scale(.95);background:#243148}.util{color:#67e8f9;background:#142436}.op{color:#d5c7ff;background:#24203a;border-color:#393054}.eq{background:linear-gradient(145deg,#0891b2,#6366f1);border:0}.zero{grid-column:span 2}.foot{display:flex;justify-content:space-between;color:#71819a;font-size:12px;padding:14px 5px 0}.hint{text-align:center;color:#71819a;font-size:12px;margin:13px 4px}@media(max-width:360px){.calc{padding:12px}.key{height:58px;border-radius:15px}.keys{gap:8px}}
</style></head><body><div class="app"><div class="head"><span>✦ <b>NOVA</b> CALC</span><span class="pill">SMART • BASIC</span></div><main class="calc"><div class="display" aria-live="polite"><div class="prev" id="prev"></div><div class="now" id="now">0</div></div><div class="keys" id="keys">
<button class="key util" data-a="clear">AC</button><button class="key util" data-a="sign">±</button><button class="key util" data-a="percent">%</button><button class="key op" data-o="÷">÷</button>
<button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button><button class="key op" data-o="×">×</button>
<button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button><button class="key op" data-o="−">−</button>
<button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button><button class="key op" data-o="+">+</button>
<button class="key zero" data-n="0">0</button><button class="key" data-a="dot">.</button><button class="key eq" data-a="equal">=</button></div><div class="foot"><span>⌫ Backspace</span><span>Keyboard supported</span></div></main><div class="hint">A clean little calculator for everyday math.</div></div>
<script>
let cur='0',old='',op=null,reset=false;const now=document.getElementById('now'),prev=document.getElementById('prev');function draw(){now.textContent=cur;prev.textContent=old}function fmt(n){if(!Number.isFinite(n))return 'Error';let s=String(Number(n.toPrecision(12)));return s.length>16?n.toExponential(6):s}function num(x){if(cur==='Error'||reset){cur=x;reset=false}else if(cur==='0')cur=x;else if(cur.replace('-','').length<16)cur+=x;draw()}function dot(){if(cur==='Error'||reset){cur='0.';reset=false}else if(!cur.includes('.'))cur+='.';draw()}function clear(){cur='0';old='';op=null;reset=false;draw()}function calc(){if(!op||!old)return;let a=Number(old.split(' ')[0]),b=Number(cur),r;switch(op){case '+':r=a+b;break;case '−':r=a-b;break;case '×':r=a*b;break;case '÷':r=b===0?NaN:a/b}cur=fmt(r);old='';op=null;reset=true;draw()}function oper(x){if(cur==='Error')return;if(op&&!reset)calc();old=cur+' '+x;op=x;reset=true;draw()}function action(a){if(a==='clear')clear();if(a==='dot')dot();if(a==='equal')calc();if(a==='sign'&&cur!=='0'&&cur!=='Error'){cur=cur.startsWith('-')?cur.slice(1):'-'+cur;draw()}if(a==='percent'&&cur!=='Error'){cur=fmt(Number(cur)/100);draw()}}document.getElementById('keys').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.n!==undefined)num(b.dataset.n);else if(b.dataset.o)oper(b.dataset.o);else if(b.dataset.a)action(b.dataset.a)});document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')num(e.key);else if(e.key==='.')dot();else if(e.key==='+')oper('+');else if(e.key==='-')oper('−');else if(e.key==='*')oper('×');else if(e.key==='/'){e.preventDefault();oper('÷')}else if(e.key==='Enter'||e.key==='=')calc();else if(e.key==='Escape')clear();else if(e.key==='Backspace'){if(cur!=='Error'&&!reset)cur=cur.length>1?cur.slice(0,-1):'0';draw()}});draw();
</script></body></html>
